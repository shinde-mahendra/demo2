version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Say hello"
          command: "echo Hello, World! > hello.md"
      - persist_to_workspace:
          root: .
          paths:
            - README.md
            - hello.md

  show-readme:
    docker:
      - image: cimg/base:current
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Display ReadMe
          command: cat README.md; cat hello.md

workflows:
  say-hello-workflow:
    jobs:
      - build
      - show-readme:
          requires:
            - build